<div class="pacs-search-panel p-3 mb-3">
  <section class="crawler-form-section mb-3">
    <h2 class="crawler-section-title">Run command</h2>
    <form class="form-row align-items-center" ic-get-from="/execute" ic-target="#result-target">
      <div class="col-md-2">
        <label for="command-input">Command</label>
      </div>
      <div class="col-md-8">
        <input class="form-control form-control-sm" type="text" id="command-input" name="command">
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary btn-sm">Execute</button>
      </div>
    </form>
  </section>
  <section class="crawler-form-section">
    <h2 class="crawler-section-title">Index accession</h2>
    <form class="form-row align-items-center" ic-get-from="/acc" ic-target="#result-target">
      <div class="col-md-2">
        <label for="acc-input">Accession number</label>
      </div>
      <div class="col-md-8">
        <input class="form-control form-control-sm" type="text" id="acc-input" name="acc">
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary btn-sm">Execute</button>
      </div>
    </form>
  </section>
</div>
