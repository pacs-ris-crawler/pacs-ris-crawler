<div class="pacs-search-panel p-3 mb-3">
  <section class="crawler-form-section mb-3">
    <h2 class="crawler-section-title">Search &amp; index</h2>
    <form class="form-inline flex-wrap align-items-center" action="/search">
      <label for="search-input" class="mr-2 mb-2">Accession number</label>
      <input class="form-control form-control-sm mb-2" type="text" id="search-input" name="accession_number"
        value="{{ accession_number | default('', true) }}" placeholder="Single accession number">
      <button type="submit" class="btn btn-primary btn-sm mb-2 ml-2">Search</button>
    </form>
  </section>

  <section class="crawler-form-section">
    <h2 class="crawler-section-title">Batch upload</h2>
    <p class="crawler-section-hint mb-2">
      On some older exams the series description is missing — prefetch first, then upload again.
    </p>
    <div class="crawler-batch-accession mb-2">
      <form class="batch-upload form-inline flex-wrap align-items-center" action="/batch-upload">
        <label for="accession_numbers" class="mr-2 mb-2">Accession numbers</label>
        <input class="form-control form-control-sm mb-2 crawler-accession-input" name="accession_numbers"
          id="accession_numbers" placeholder="Space-separated">
        <button type="submit" class="btn btn-primary btn-sm mb-2 ml-2">Upload</button>
      </form>
      <form class="prefetch-batch-upload form-inline align-items-center mb-2" action="/prefetch">
        <button type="submit" class="btn btn-outline-secondary btn-sm">Prefetch</button>
      </form>
    </div>
    <form class="batch-upload crawler-date-range-form d-flex flex-wrap align-items-end" action="/batch-upload">
      <div class="crawler-date-field mb-2 mr-3">
        <label for="from-date" class="d-block mb-1">From</label>
        <input class="form-control form-control-sm" type="date" id="from-date" name="from-date">
      </div>
      <div class="crawler-date-field mb-2 mr-3">
        <label for="to-date" class="d-block mb-1">To</label>
        <input class="form-control form-control-sm" type="date" id="to-date" name="to-date">
      </div>
      <button type="submit" class="btn btn-primary btn-sm mb-2">Upload by date range</button>
    </form>
  </section>
</div>
