{% extends "page.html" %}

{% block body_content %}
<div class="container-fluid px-4 pb-4">
  <div class="pacs-main mx-auto">
    {% include 'partials/navbar.html' %}
    {% include 'partials/search.html' %}
    {% block crawler_main %}{% endblock %}
    <div class="pacs-card crawler-rq-panel mt-3">
      <div class="crawler-panel-heading d-flex justify-content-between align-items-center">
        <span>Job queue (RQ)</span>
        <button type="button" id="reload-button" class="btn btn-outline-teal btn-sm py-0">Reload</button>
      </div>
      <div class="crawler-rq-frame">
        <iframe id="prefect" src="/rq" title="RQ Dashboard"></iframe>
      </div>
    </div>
  </div>
</div>
{% endblock %}
