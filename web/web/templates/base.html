{% extends "page.html" %}

{% block content %}
<div class="container-fluid px-4">
  <div class="pacs-main mx-auto">
    {% include 'partials/navbar.html' %}
    <div class="pacs-search-panel p-3 mb-3">
      {% block search %}
      {% endblock %}
    </div>
    {% if show_transfer_targets or show_download_options %}
    {% include 'partials/actions.html' %}
    {% endif %}
    <div class="pt-1 pb-4">
      {% block table %}
      {% endblock %}
    </div>
  </div>
</div>
{% endblock %}
