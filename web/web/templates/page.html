<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('pacs-ris-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PACS RIS Crawler</title>
  <link rel="icon" type="image/png" href="{{url_for('static', filename='images/favicon.png') }}">
  <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/pikaday.css') }}">
  <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/open-iconic-bootstrap.min.css') }}">
  <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/app-theme.css') }}">
  <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/style.css') }}">
  <style>
    @font-face {
      font-family: 'Source Serif 4';
      font-style: normal;
      font-weight: 200 900;
      font-display: swap;
      src: url("{{ url_for('static', filename='css/fonts/SourceSerif4-VariableFont.woff2') }}") format('woff2');
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("{{ url_for('static', filename='css/fonts/Inter-latin.woff2') }}") format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("{{ url_for('static', filename='css/fonts/Inter-latin-ext.woff2') }}") format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("{{ url_for('static', filename='css/fonts/JetBrainsMono-Regular.woff2') }}") format('woff2');
    }
  </style>
  <!-- Matomo Image Tracker-->
  <img referrerpolicy="no-referrer-when-downgrade" src="https://analytics.ict-mscc.uhbs.ch/matomo.php?idsite=3&amp;rec=1" style="border:0" alt="" />
  <!-- End Matomo -->
</head>

<body>
  <div id="loading" class="loading d-none">Loading&#8230;</div>
  {% block content %}
  {% endblock %}
  {% assets "js_all" %}
    <script type="text/javascript" src="{{ ASSET_URL }}"></script>
  {% endassets %}
</body>
</html>
